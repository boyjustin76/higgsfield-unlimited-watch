[package]
name = "huw"
version = "0.2.0-dev"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scraper = "0.24"
url = "2"
uuid = "1"
chrono = "0.4"
tempfile = "3"
wait-timeout = "0.2"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
